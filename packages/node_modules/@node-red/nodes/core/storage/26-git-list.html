<script type="text/html" data-template-name="git list">
    <div class="form-row">
        <label for="node-input-mode"><i class="fa fa-list"></i> <span data-i18n="git-list.label.mode"></span></label>
        <select id="node-input-mode" style="width: 70%;">
            <option value="repositories" data-i18n="git-list.label.repositories"></option>
            <option value="branches" data-i18n="git-list.label.branches"></option>
            <option value="formData" data-i18n="git-list.label.formData"></option>
        </select>
    </div>
    <div class="form-row node-input-repository-row">
        <label for="node-input-repository"><i class="fa fa-folder-open"></i> <span data-i18n="git-list.label.repository"></span></label>
        <input type="text" id="node-input-repository" style="width: 70%;">
        <input type="hidden" id="node-input-repositoryType">
    </div>
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> <span data-i18n="common.label.name"></span></label>
        <input type="text" id="node-input-name">
    </div>
</script>

<script type="text/javascript">
    RED.nodes.registerType("git list", {
        category: "storage",
        color: "BurlyWood",
        defaults: {
            name: {value: ""},
            mode: {value: "repositories"},
            repository: {value: "payload.repository"},
            repositoryType: {value: "msg"}
        },
        inputs: 1,
        outputs: 1,
        icon: "file-in.svg",
        label: function() {
            return this.name || this._("git-list.name");
        },
        oneditprepare: function() {
            $("#node-input-repository").typedInput({default: "msg", types: ["msg", "str", "env"], typeField: $("#node-input-repositoryType")});
            $("#node-input-mode").on("change", function() {
                $(".node-input-repository-row").toggle($(this).val() === "branches");
            }).trigger("change");
        }
    });
</script>

<script type="text/html" data-help-name="git list">
    <p>Read-only list of repositories or branches from the configured <code>gitReposDirectory</code>. The node does not switch branches or contact a remote Git server.</p>
    <p>Repository and branch list modes preserve the message and write <code>msg.options</code> as <code>{label, value}</code> entries. <b>Slack form data</b> mode replaces <code>msg.payload</code> with <code>{repositories:[...],branches:{repositoryName:[...]}}</code>. Connect <b>Slack Socket → Git List (Slack form data) → Slack Form</b> for simple dropdowns. Large repository collections may take too long for Slack's short-lived form trigger.</p>
</script>
