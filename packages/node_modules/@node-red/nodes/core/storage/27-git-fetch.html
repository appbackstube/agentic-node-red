<script type="text/html" data-template-name="git fetch">
    <div class="form-row">
        <label for="node-input-mode"><i class="fa fa-refresh"></i> <span data-i18n="git-fetch.label.mode"></span></label>
        <select id="node-input-mode" style="width: 70%;">
            <option value="all" data-i18n="git-fetch.label.all"></option>
            <option value="repository" data-i18n="git-fetch.label.repository"></option>
        </select>
    </div>
    <div class="form-row node-input-repository-row">
        <label for="node-input-repository"><i class="fa fa-folder-open"></i> <span data-i18n="git-fetch.label.repository"></span></label>
        <input type="text" id="node-input-repository" style="width: 70%;">
        <input type="hidden" id="node-input-repositoryType">
    </div>
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> <span data-i18n="common.label.name"></span></label>
        <input type="text" id="node-input-name">
    </div>
</script>

<script type="text/javascript">
    RED.nodes.registerType("git fetch", {
        category: "storage",
        color: "BurlyWood",
        defaults: {
            name: {value: ""},
            mode: {value: "all"},
            repository: {value: "payload.repository"},
            repositoryType: {value: "msg"}
        },
        inputs: 1,
        outputs: 1,
        icon: "file-in.svg",
        label: function() {
            return this.name || this._("git-fetch.name");
        },
        oneditprepare: function() {
            $("#node-input-repository").typedInput({default: "msg", types: ["msg", "str", "env"], typeField: $("#node-input-repositoryType")});
            $("#node-input-mode").on("change", function() {
                $(".node-input-repository-row").toggle($(this).val() === "repository");
            }).trigger("change");
        }
    });
</script>

<script type="text/html" data-help-name="git fetch">
    <p>Run <code>git fetch --all --prune</code> asynchronously for all repositories in <code>gitReposDirectory</code> or one selected repository. Repository names use the same directory restrictions as <b>git repo</b> and <b>git list</b>.</p>
    <p>The node forwards the original message unchanged only after all fetches succeed. A failed fetch reports an error and stops that message. It does not switch branches, merge commits, or change working files.</p>
    <p>Use an Inject node to refresh remote references separately, for example on a schedule. Keep <b>git fetch</b> out of the Slack command path: <b>Slack Socket → Git List → Slack Form</b> reads the latest locally available references without waiting for a remote server.</p>
</script>
