<script type="text/html" data-template-name="git repo">
    <div class="form-row">
        <label for="node-input-repository"><i class="fa fa-folder-open"></i> <span data-i18n="git-repo.label.repository"></span></label>
        <select id="node-input-repository" style="width: 70%;"></select>
    </div>
    <div class="form-row">
        <label for="node-input-branch"><i class="fa fa-code-fork"></i> <span data-i18n="git-repo.label.branch"></span></label>
        <select id="node-input-branch" style="width: 70%;"></select>
    </div>
    <div class="form-row">
        <label>&nbsp;</label>
        <input type="checkbox" id="node-input-fetchRemote" style="display: inline-block; width: auto; vertical-align: top;">
        <label for="node-input-fetchRemote" style="width: 70%;"><span data-i18n="git-repo.label.fetchRemote"></span></label>
    </div>
    <div class="form-row">
        <label>&nbsp;</label>
        <input type="checkbox" id="node-input-pullLatest" style="display: inline-block; width: auto; vertical-align: top;">
        <label for="node-input-pullLatest" style="width: 70%;"><span data-i18n="git-repo.label.pullLatest"></span></label>
    </div>
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> <span data-i18n="common.label.name"></span></label>
        <input type="text" id="node-input-name">
    </div>
    <div class="form-tips" id="node-input-git-repo-tip" style="display: none;"></div>
</script>

<script type="text/javascript">
    RED.nodes.registerType("git repo", {
        category: "storage",
        defaults: {
            name: {value: ""},
            repository: {value: ""},
            branch: {value: ""},
            fetchRemote: {value: false},
            pullLatest: {value: false}
        },
        color: "BurlyWood",
        inputs: 1,
        outputs: 1,
        icon: "file-in.svg",
        label: function() {
            return this.name || this.repository || this._("git-repo.name");
        },
        labelStyle: function() {
            return this.name ? "node_label_italic" : "";
        },
        oneditprepare: function() {
            const node = this;
            const repositorySelect = $("#node-input-repository");
            const branchSelect = $("#node-input-branch");
            const tip = $("#node-input-git-repo-tip");
            let branchRequest = 0;

            function showTip(message) {
                tip.text(message).toggle(!!message);
            }

            function placeholder(select, message) {
                select.empty().append($("<option/>", {value: ""}).text(message));
            }

            function loadBranches() {
                const request = ++branchRequest;
                const repository = repositorySelect.val();
                placeholder(branchSelect, node._("git-repo.placeholder.branch"));
                if (!repository) {
                    return;
                }
                $.getJSON("git-repos/" + encodeURIComponent(repository) + "/branches").done(function(branches) {
                    if (request !== branchRequest) {
                        return;
                    }
                    const local = $("<optgroup/>", {label: node._("git-repo.label.local")});
                    const remote = $("<optgroup/>", {label: node._("git-repo.label.remote")});
                    branches.forEach(function(branch) {
                        $("<option/>", {value: branch.ref}).text(branch.name).appendTo(branch.remote ? remote : local);
                    });
                    local.appendTo(branchSelect);
                    remote.appendTo(branchSelect);
                    if (repository === node.repository && branches.some(branch => branch.ref === node.branch)) {
                        branchSelect.val(node.branch);
                        showTip("");
                    } else if (repository === node.repository && node.branch) {
                        showTip(node._("git-repo.error.missing-branch"));
                    } else if (branches.length === 0) {
                        showTip(node._("git-repo.error.no-branches"));
                    } else {
                        showTip("");
                    }
                }).fail(function() {
                    if (request === branchRequest) {
                        showTip(node._("git-repo.error.load-branches"));
                    }
                });
            }

            repositorySelect.on("change", loadBranches);
            placeholder(repositorySelect, node._("git-repo.placeholder.repository"));
            placeholder(branchSelect, node._("git-repo.placeholder.branch"));
            $.getJSON("git-repos").done(function(repositories) {
                repositories.forEach(function(repository) {
                    $("<option/>", {value: repository}).text(repository).appendTo(repositorySelect);
                });
                if (repositories.includes(node.repository)) {
                    repositorySelect.val(node.repository);
                    loadBranches();
                } else if (node.repository) {
                    showTip(node._("git-repo.error.missing-repository"));
                } else if (repositories.length === 0) {
                    showTip(node._("git-repo.error.no-repositories"));
                }
            }).fail(function() {
                showTip(node._("git-repo.error.load-repositories"));
            });
        }
    });
</script>

<script type="text/html" data-help-name="git repo">
    <p>Checks out a Git branch in a repository allowed by <code>gitReposDirectory</code>. Configure a repository and branch in the editor, or pass both <code>msg.payload.repository</code> and <code>msg.payload.branch</code> to override them.</p>
    <p>On input, adds <code>msg.git</code> with <code>repository</code>, the checked-out <code>branch</code> and <code>ref</code>, and the absolute server-side <code>path</code>. Other message properties stay unchanged.</p>
    <p>Local and already known remote branches are supported. A remote branch creates or reuses a local tracking branch. Enable <b>Fetch remote updates</b> to refresh remote refs before selecting the branch. Enable <b>Fast-forward to latest</b> to fetch and fast-forward the checked-out branch to its upstream; this also works without the fetch checkbox. It fails when the branch has no upstream, the history has diverged, or the working tree has changes. No forced checkout or reset is performed. The path can reveal the server's directory structure to recipients of the message.</p>
</script>
