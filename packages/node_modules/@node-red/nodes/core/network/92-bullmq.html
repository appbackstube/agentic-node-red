<script type="text/html" data-template-name="bullmq redis">
    <div class="form-row"><label for="node-config-input-name" data-i18n="common.label.name"></label><input type="text" id="node-config-input-name"></div>
    <div class="form-row"><label for="node-config-input-host" data-i18n="bullmq.label.host"></label><input type="text" id="node-config-input-host"></div>
    <div class="form-row"><label for="node-config-input-port" data-i18n="bullmq.label.port"></label><input type="number" id="node-config-input-port" min="1" max="65535"></div>
    <div class="form-row"><label for="node-config-input-db" data-i18n="bullmq.label.db"></label><input type="number" id="node-config-input-db" min="0"></div>
    <div class="form-row"><label for="node-config-input-username" data-i18n="bullmq.label.username"></label><input type="text" id="node-config-input-username"></div>
    <div class="form-row"><label for="node-config-input-password" data-i18n="bullmq.label.password"></label><input type="password" id="node-config-input-password"></div>
    <div class="form-row"><label for="node-config-input-tls" data-i18n="bullmq.label.tls"></label><input type="checkbox" id="node-config-input-tls" style="width: auto;"></div>
</script>

<script type="text/javascript">
    RED.nodes.registerType("bullmq redis", {
        category: "config",
        defaults: {
            name: {value: ""},
            host: {value: "localhost", required: true},
            port: {value: 6379, required: true, validate: RED.validators.number()},
            db: {value: 0, required: true, validate: RED.validators.number()},
            tls: {value: false}
        },
        credentials: {username: {type: "text"}, password: {type: "password"}},
        label: function() { return this.name || this.host + ":" + this.port; }
    });
    RED.nodes.registerType("bullmq out", {
        category: "network",
        color: "#d9cbe8",
        defaults: {
            name: {value: ""},
            redis: {value: "", type: "bullmq redis", required: true},
            queue: {value: "", required: true},
            jobName: {value: "message"}
        },
        inputs: 1,
        outputs: 1,
        icon: "redis.svg",
        align: "right",
        label: function() { return this.name || this._("bullmq.out") + ": " + this.queue; }
    });
    RED.nodes.registerType("bullmq in", {
        category: "network",
        color: "#d9cbe8",
        defaults: {
            name: {value: ""},
            redis: {value: "", type: "bullmq redis", required: true},
            queue: {value: "", required: true},
            concurrency: {value: 1, required: true, validate: function(value) { return /^[1-9]\d*$/.test(String(value)) && Number.isSafeInteger(Number(value)); }}
        },
        inputs: 0,
        outputs: 1,
        icon: "redis.svg",
        label: function() { return this.name || this._("bullmq.in") + ": " + this.queue; }
    });
    RED.nodes.registerType("bullmq done", {
        category: "network",
        color: "#d9cbe8",
        defaults: {
            name: {value: ""},
            result: {value: "completed"}
        },
        inputs: 1,
        outputs: 0,
        icon: "redis.svg",
        label: function() { return this.name || this._("bullmq.done"); }
    });
</script>

<script type="text/html" data-template-name="bullmq out">
    <div class="form-row"><label for="node-input-redis" data-i18n="bullmq.label.redis"></label><input type="text" id="node-input-redis"></div>
    <div class="form-row"><label for="node-input-queue" data-i18n="bullmq.label.queue"></label><input type="text" id="node-input-queue"></div>
    <div class="form-row"><label for="node-input-jobName" data-i18n="bullmq.label.jobName"></label><input type="text" id="node-input-jobName"></div>
    <div class="form-row"><label for="node-input-name" data-i18n="common.label.name"></label><input type="text" id="node-input-name"></div>
</script>

<script type="text/html" data-template-name="bullmq in">
    <div class="form-row"><label for="node-input-redis" data-i18n="bullmq.label.redis"></label><input type="text" id="node-input-redis"></div>
    <div class="form-row"><label for="node-input-queue" data-i18n="bullmq.label.queue"></label><input type="text" id="node-input-queue"></div>
    <div class="form-row"><label for="node-input-concurrency" data-i18n="bullmq.label.concurrency"></label><input type="number" id="node-input-concurrency" min="1" step="1"></div>
    <div class="form-row"><label for="node-input-name" data-i18n="common.label.name"></label><input type="text" id="node-input-name"></div>
</script>

<script type="text/html" data-template-name="bullmq done">
    <div class="form-row"><label for="node-input-result" data-i18n="bullmq.label.result"></label><select id="node-input-result"><option value="completed" data-i18n="bullmq.label.completed"></option><option value="failed" data-i18n="bullmq.label.failed"></option></select></div>
    <div class="form-row"><label for="node-input-name" data-i18n="common.label.name"></label><input type="text" id="node-input-name"></div>
</script>

<script type="text/html" data-help-name="bullmq redis">
    <p>Connection to a Redis server for BullMQ nodes. Set host, port, database and optional username/password. Enable TLS for encrypted Redis connections.</p>
</script>
<script type="text/html" data-help-name="bullmq out">
    <p>Enqueues a JSON-serializable Node-RED message as a BullMQ job. The original message is forwarded after the job is stored, with <code>msg.bullmq</code> containing the queue name, job ID and job name. <code>pendingCount</code> is the number of unfinished jobs (including this job) in waiting, active, delayed, prioritized or waiting-children states. <code>jobsAhead</code> is the number of active jobs plus waiting jobs ahead of this job; it is <code>null</code> if the job is no longer waiting. These values are snapshots, not guaranteed positions: concurrent workers and producers can change them immediately. Reading the position loads the waiting list, so large queues increase cost. If the count query fails after enqueuing, both counts are <code>null</code> and the job is still forwarded. <code>_msgid</code> is not stored. Invalid or non-serializable messages and enqueue errors are sent to a Catch node.</p>
</script>
<script type="text/html" data-help-name="bullmq in">
    <p>Reads jobs from the configured queue and emits their data as Node-RED messages. <code>msg.bullmq</code> contains the queue name, job ID, job name and completion metadata. Wire a <code>bullmq done</code> node after the last asynchronous step to complete the job. Simultaneous jobs limits active worker callbacks on this node (default 1). With one worker and concurrency 1, the next job starts only after the done node receives the message. If multiple branches must finish, join them before the done node. A message that never reaches done keeps its job active; route errors to a done node configured as failed. On redeploy, unacknowledged jobs fail and follow BullMQ's configured retry policy.</p>
</script>
<script type="text/html" data-help-name="bullmq done">
    <p>Completes the active BullMQ job associated with <code>msg.bullmq</code>. Place this node at the end of the flow, after all work that must finish before the next job. Select Failed for an error path (for example from a Catch node); <code>msg.error.message</code> is used as the failure reason. Keep <code>msg.bullmq</code> unchanged along the path. A missing or already finished job is reported to a Catch node.</p>
</script>
