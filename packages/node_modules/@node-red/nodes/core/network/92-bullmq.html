<script type="text/html" data-template-name="bullmq redis">
    <div class="form-row"><label for="node-config-input-name" data-i18n="common.label.name"></label><input type="text" id="node-config-input-name"></div>
    <div class="form-row"><label for="node-config-input-host" data-i18n="bullmq.label.host"></label><input type="text" id="node-config-input-host"></div>
    <div class="form-row"><label for="node-config-input-port" data-i18n="bullmq.label.port"></label><input type="number" id="node-config-input-port" min="1" max="65535"></div>
    <div class="form-row"><label for="node-config-input-db" data-i18n="bullmq.label.db"></label><input type="number" id="node-config-input-db" min="0"></div>
    <div class="form-row"><label for="node-config-input-username" data-i18n="bullmq.label.username"></label><input type="text" id="node-config-input-username"></div>
    <div class="form-row"><label for="node-config-input-password" data-i18n="bullmq.label.password"></label><input type="password" id="node-config-input-password"></div>
    <div class="form-row"><label for="node-config-input-tls" data-i18n="bullmq.label.tls"></label><input type="checkbox" id="node-config-input-tls" style="width: auto;"></div>
</script>

<script type="text/javascript">
    RED.nodes.registerType("bullmq redis", {
        category: "config",
        defaults: {
            name: {value: ""},
            host: {value: "localhost", required: true},
            port: {value: 6379, required: true, validate: RED.validators.number()},
            db: {value: 0, required: true, validate: RED.validators.number()},
            tls: {value: false}
        },
        credentials: {username: {type: "text"}, password: {type: "password"}},
        label: function() { return this.name || this.host + ":" + this.port; }
    });
    RED.nodes.registerType("bullmq out", {
        category: "network",
        color: "#d9cbe8",
        defaults: {
            name: {value: ""},
            redis: {value: "", type: "bullmq redis", required: true},
            queue: {value: "", required: true},
            jobName: {value: "message"}
        },
        inputs: 1,
        outputs: 1,
        icon: "redis.svg",
        align: "right",
        label: function() { return this.name || this._("bullmq.out") + ": " + this.queue; }
    });
    RED.nodes.registerType("bullmq in", {
        category: "network",
        color: "#d9cbe8",
        defaults: {
            name: {value: ""},
            redis: {value: "", type: "bullmq redis", required: true},
            queue: {value: "", required: true},
            concurrency: {value: 1, required: true, validate: function(value) { return /^[1-9]\d*$/.test(String(value)) && Number.isSafeInteger(Number(value)); }}
        },
        inputs: 0,
        outputs: 1,
        icon: "redis.svg",
        label: function() { return this.name || this._("bullmq.in") + ": " + this.queue; }
    });
</script>

<script type="text/html" data-template-name="bullmq out">
    <div class="form-row"><label for="node-input-redis" data-i18n="bullmq.label.redis"></label><input type="text" id="node-input-redis"></div>
    <div class="form-row"><label for="node-input-queue" data-i18n="bullmq.label.queue"></label><input type="text" id="node-input-queue"></div>
    <div class="form-row"><label for="node-input-jobName" data-i18n="bullmq.label.jobName"></label><input type="text" id="node-input-jobName"></div>
    <div class="form-row"><label for="node-input-name" data-i18n="common.label.name"></label><input type="text" id="node-input-name"></div>
</script>

<script type="text/html" data-template-name="bullmq in">
    <div class="form-row"><label for="node-input-redis" data-i18n="bullmq.label.redis"></label><input type="text" id="node-input-redis"></div>
    <div class="form-row"><label for="node-input-queue" data-i18n="bullmq.label.queue"></label><input type="text" id="node-input-queue"></div>
    <div class="form-row"><label for="node-input-concurrency" data-i18n="bullmq.label.concurrency"></label><input type="number" id="node-input-concurrency" min="1" step="1"></div>
    <div class="form-row"><label for="node-input-name" data-i18n="common.label.name"></label><input type="text" id="node-input-name"></div>
</script>

<script type="text/html" data-help-name="bullmq redis">
    <p>Connection to a Redis server for BullMQ nodes. Set host, port, database and optional username/password. Enable TLS for encrypted Redis connections.</p>
</script>
<script type="text/html" data-help-name="bullmq out">
    <p>Enqueues a JSON-serializable Node-RED message as a BullMQ job. The original message is forwarded after the job is stored, with <code>msg.bullmq</code> containing the queue name, job ID and job name. <code>_msgid</code> is not stored. Invalid or non-serializable messages are sent to a Catch node.</p>
</script>
<script type="text/html" data-help-name="bullmq in">
    <p>Reads jobs from the configured queue and emits their data as Node-RED messages. <code>msg.bullmq</code> contains the queue name, job ID and job name. Simultaneous jobs limits concurrent BullMQ worker callbacks on this node (default 1), not the number of downstream Node-RED tasks running. BullMQ marks a job complete when the message is handed to the flow; downstream errors cannot retry the job. For end-to-end acknowledgements, use a separate job completion design.</p>
</script>
