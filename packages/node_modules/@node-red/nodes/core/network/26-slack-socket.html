<script type="text/html" data-template-name="slack socket">
    <div class="form-row">
        <label for="node-input-botToken"><i class="fa fa-key"></i> <span data-i18n="slack-socket.label.botToken"></span></label>
        <input type="password" id="node-input-botToken">
    </div>
    <div class="form-row">
        <label for="node-input-appToken"><i class="fa fa-lock"></i> <span data-i18n="slack-socket.label.appToken"></span></label>
        <input type="password" id="node-input-appToken">
    </div>
    <div class="form-row">
        <label for="node-input-eventType"><i class="fa fa-envelope"></i> <span data-i18n="slack-socket.label.eventType"></span></label>
        <select id="node-input-eventType" style="width: 70%;">
            <option value="message" data-i18n="slack-socket.label.message"></option>
            <option value="app_mention" data-i18n="slack-socket.label.appMention"></option>
            <option value="both" data-i18n="slack-socket.label.both"></option>
        </select>
    </div>
    <div class="form-row">
        <label>&nbsp;</label>
        <input type="checkbox" id="node-input-includeCommands" style="display: inline-block; width: auto; vertical-align: top;">
        <label for="node-input-includeCommands" style="width: 70%;" data-i18n="slack-socket.label.includeCommands"></label>
    </div>
    <div class="form-row node-input-command-row">
        <label for="node-input-command"><i class="fa fa-terminal"></i> <span data-i18n="slack-socket.label.command"></span></label>
        <input type="text" id="node-input-command" data-i18n="[placeholder]slack-socket.placeholder.command">
    </div>
    <div class="form-row">
        <label for="node-input-channel"><i class="fa fa-hashtag"></i> <span data-i18n="slack-socket.label.channel"></span></label>
        <input type="text" id="node-input-channel" data-i18n="[placeholder]slack-socket.placeholder.optional">
    </div>
    <div class="form-row">
        <label for="node-input-user"><i class="fa fa-user"></i> <span data-i18n="slack-socket.label.user"></span></label>
        <input type="text" id="node-input-user" data-i18n="[placeholder]slack-socket.placeholder.optional">
    </div>
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> <span data-i18n="common.label.name"></span></label>
        <input type="text" id="node-input-name">
    </div>
</script>

<script type="text/javascript">
    RED.nodes.registerType("slack socket", {
        category: "network",
        color: "rgb(231, 231, 174)",
        defaults: {
            name: {value: ""},
            eventType: {value: "app_mention"},
            includeCommands: {value: true},
            command: {value: ""},
            channel: {value: ""},
            user: {value: ""}
        },
        credentials: {
            botToken: {type: "password"},
            appToken: {type: "password"}
        },
        inputs: 0,
        outputs: 1,
        icon: "white-globe.svg",
        label: function() {
            return this.name || this._("slack-socket.name");
        },
        labelStyle: function() {
            return this.name ? "node_label_italic" : "";
        },
        oneditprepare: function() {
            $("#node-input-includeCommands").on("change", function() {
                $(".node-input-command-row").toggle($(this).is(":checked"));
            }).trigger("change");
        }
    });
</script>

<script type="text/html" data-help-name="slack socket">
    <p>Connects to Slack over Bolt Socket Mode and emits incoming user messages, app mentions, or slash commands. It listens for app mentions and slash commands by default. Configure the bot token and an app-level token with <code>connections:write</code> as Node-RED credentials.</p>
    <p>Create and enable the slash command in your Slack app and grant the <code>commands</code> scope. Reinstall the app in the workspace if you changed its scopes. Commands are acknowledged immediately; their argument text goes into <code>msg.payload</code>, the channel ID into <code>msg.topic</code>, and the command name into <code>msg.slack.command</code>. The response URL is not forwarded. Optional command, channel, and user ID filters narrow the input. Use a Switch node on <code>msg.slack.eventType</code> or <code>msg.slack.command</code> to route the result, and connect a Slack Post node if a reply is needed.</p>
    <p>To show a form, connect <b>Slack Socket → data node → Slack form flow</b>. The data node must preserve <code>msg.slack</code>; the form node defines its fields and opens the modal. The trigger ID and response URL are never forwarded.</p>
    <p>Channel and user filters remain optional. Enable Socket Mode in Slack. For ordinary messages, subscribe to <code>message.channels</code> or <code>message.im</code> with matching history scopes; for mentions, subscribe to <code>app_mention</code> with <code>app_mentions:read</code>. Bot messages and edits are ignored. No public HTTP endpoint is needed. The connection stops when the node is removed or redeployed.</p>
</script>
