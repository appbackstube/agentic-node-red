<script type="text/html" data-template-name="slack form flow">
    <div class="form-row">
        <label for="node-input-command"><i class="fa fa-terminal"></i> <span data-i18n="slack-form-flow.label.command"></span></label>
        <input type="text" id="node-input-command">
    </div>
    <div class="form-row">
        <label for="node-input-title"><i class="fa fa-file-text-o"></i> <span data-i18n="slack-form-flow.label.title"></span></label>
        <input type="text" id="node-input-title">
    </div>
    <div class="form-row">
        <label for="node-input-fields"><i class="fa fa-list"></i> <span data-i18n="slack-form-flow.label.fields"></span></label>
        <textarea id="node-input-fields" rows="9" style="width: 70%; vertical-align: top;"></textarea>
    </div>
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> <span data-i18n="common.label.name"></span></label>
        <input type="text" id="node-input-name">
    </div>
</script>

<script type="text/javascript">
    RED.nodes.registerType("slack form flow", {
        category: "network",
        color: "rgb(231, 231, 174)",
        defaults: {
            name: {value: ""},
            command: {value: "", required: true},
            title: {value: "", required: true},
            fields: {value: "", required: true}
        },
        inputs: 1,
        outputs: 1,
        icon: "white-globe.svg",
        label: function() {
            return this.name || this.title || this._("slack-form-flow.name");
        },
        labelStyle: function() {
            return this.name ? "node_label_italic" : "";
        }
    });
</script>

<script type="text/html" data-help-name="slack form flow">
    <p>Connect <b>Slack Socket → data node → Slack Form</b>. The data node must preserve <code>msg.slack</code> and provide its data in the same message before Slack's short-lived trigger expires. For Git data, set <b>git list</b> to <b>Slack form data</b>.</p>
    <p>Configure the command, title and a JSON array of 1 to 10 fields in this node. Each field needs a unique <code>name</code> and a <code>label</code>; <code>type</code> is <code>text</code> (the default) or <code>select</code>. A select reads options from its configured path, such as <code>source: "msg.payload.projects"</code>. The path must contain an array of strings or <code>{"label":"Project","value":"project-id"}</code> entries. A dependent select can use a map of such arrays and <code>dependsOn</code> to name its parent select. Static selects use <code>source: "static"</code> and an <code>options</code> array. Options are not selected automatically; an explicit <code>default</code> may preselect a matching value.</p>
    <p>The node has one output. After submission, <code>msg.payload</code> contains the field names and submitted values. The short-lived Slack trigger stays inside the Socket node.</p>
</script>
