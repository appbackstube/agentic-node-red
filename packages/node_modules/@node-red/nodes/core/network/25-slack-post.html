<script type="text/html" data-template-name="slack post">
    <div class="form-row">
        <label for="node-input-botToken"><i class="fa fa-key"></i> <span data-i18n="slack-post.label.botToken"></span></label>
        <input type="password" id="node-input-botToken">
    </div>
    <div class="form-row">
        <label for="node-input-signingSecret"><i class="fa fa-lock"></i> <span data-i18n="slack-post.label.signingSecret"></span></label>
        <input type="password" id="node-input-signingSecret">
    </div>
    <div class="form-row">
        <label for="node-input-destinationType"><i class="fa fa-user"></i> <span data-i18n="slack-post.label.sendTo"></span></label>
        <select id="node-input-destinationType" style="width: 70%;">
            <option value="channel" data-i18n="slack-post.label.channel"></option>
            <option value="user" data-i18n="slack-post.label.user"></option>
        </select>
    </div>
    <div class="form-row">
        <label for="node-input-destination"><i class="fa fa-hashtag"></i> <span data-i18n="slack-post.label.destination"></span></label>
        <input type="text" id="node-input-destination" style="width: 70%;">
        <input type="hidden" id="node-input-destinationValueType">
    </div>
    <div class="form-row">
        <label for="node-input-sendAs"><i class="fa fa-paper-plane"></i> <span data-i18n="slack-post.label.sendAs"></span></label>
        <select id="node-input-sendAs" style="width: 70%;">
            <option value="text" data-i18n="slack-post.label.text"></option>
            <option value="markdown" data-i18n="slack-post.label.markdownFile"></option>
        </select>
    </div>
    <div class="form-row">
        <label for="node-input-text"><i class="fa fa-comment"></i> <span data-i18n="slack-post.label.message"></span></label>
        <input type="text" id="node-input-text" style="width: 70%;">
        <input type="hidden" id="node-input-textType">
    </div>
    <div class="form-row node-input-filename-row">
        <label for="node-input-filename"><i class="fa fa-file-text-o"></i> <span data-i18n="slack-post.label.filename"></span></label>
        <input type="text" id="node-input-filename" style="width: 70%;">
        <input type="hidden" id="node-input-filenameType">
    </div>
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> <span data-i18n="common.label.name"></span></label>
        <input type="text" id="node-input-name">
    </div>
</script>

<script type="text/javascript">
    RED.nodes.registerType("slack post", {
        category: "network",
        color: "rgb(231, 231, 174)",
        defaults: {
            name: {value: ""},
            destinationType: {value: "channel"},
            destination: {value: "", required: true},
            destinationValueType: {value: "str"},
            sendAs: {value: "text"},
            text: {value: "payload", required: true},
            textType: {value: "msg"},
            filename: {value: "message.md"},
            filenameType: {value: "str"}
        },
        credentials: {
            botToken: {type: "password"},
            signingSecret: {type: "password"}
        },
        inputs: 1,
        outputs: 1,
        icon: "white-globe.svg",
        label: function() {
            return this.name || this._("slack-post.name");
        },
        labelStyle: function() {
            return this.name ? "node_label_italic" : "";
        },
        oneditprepare: function() {
            $("#node-input-destination").typedInput({default: "str", types: ["str", "msg", "env"], typeField: $("#node-input-destinationValueType")});
            $("#node-input-text").typedInput({default: "msg", types: ["msg", "str", "env"], typeField: $("#node-input-textType")});
            $("#node-input-filename").typedInput({default: "str", types: ["str", "msg", "env"], typeField: $("#node-input-filenameType")});
            $("#node-input-sendAs").on("change", function() {
                $(".node-input-filename-row").toggle($(this).val() === "markdown");
            }).trigger("change");
        }
    });
</script>

<script type="text/html" data-help-name="slack post">
    <p>Sends a text message using the Slack Bolt SDK. Enter a Slack bot token and signing secret as Node-RED credentials. The node only posts messages; it does not start a Slack event listener.</p>
    <p>Choose a channel and provide its ID (<code>C...</code> or <code>G...</code>), or choose a user and provide the user's ID (<code>U...</code> or <code>W...</code>). User messages are sent as direct messages through <code>conversations.open</code>. The destination and text fields can also read message properties.</p>
    <p>Content defaults to <code>msg.payload</code>. Select <b>Markdown file</b> to upload that string as a <code>.md</code> file. No local file path is read; the file is created from the message contents. The default filename is <code>message.md</code>.</p>
    <p>The node preserves the message and adds <code>msg.slack.channel</code> and either <code>msg.slack.ts</code> (text) or <code>msg.slack.fileId</code> (file) after posting. Errors go to a Catch node; no output is sent on error. The bot needs <code>chat:write</code> for text, <code>files:write</code> for files, and <code>im:write</code> for direct messages.</p>
</script>
