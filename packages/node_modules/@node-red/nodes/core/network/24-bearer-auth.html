<script type="text/html" data-template-name="bearer auth">
    <div class="form-row">
        <label for="node-input-token"><i class="fa fa-key"></i> <span data-i18n="bearer-auth.label.token"></span></label>
        <input type="password" id="node-input-token">
    </div>
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> <span data-i18n="common.label.name"></span></label>
        <input type="text" id="node-input-name">
    </div>
</script>

<script type="text/javascript">
    RED.nodes.registerType("bearer auth", {
        category: "network",
        color: "rgb(231, 231, 174)",
        defaults: {
            name: {value: ""}
        },
        credentials: {
            token: {type: "password"}
        },
        inputs: 1,
        outputs: 1,
        icon: "white-globe.svg",
        label: function() {
            return this.name || this._("bearer-auth.name");
        },
        labelStyle: function() {
            return this.name ? "node_label_italic" : "";
        }
    });
</script>

<script type="text/html" data-help-name="bearer auth">
    <p>Put this node directly after an HTTP In node. Enter the expected bearer token in the credential field, not in the flow configuration.</p>
    <p>The node checks the <code>Authorization: Bearer &lt;token&gt;</code> request header. A matching token forwards the original message to the next node. A missing or invalid token returns HTTP 401 with a <code>WWW-Authenticate: Bearer</code> header and does not forward the message.</p>
    <p>Without a configured token, it returns HTTP 503. Connect the successful output to an HTTP Response node to complete accepted requests. Use HTTPS so the token is not sent in plain text, and do not log <code>msg.req.headers</code>.</p>
</script>
