<script type="text/html" data-template-name="codex agent">
    <div class="form-row">
        <label for="node-input-directory"><i class="fa fa-folder-open"></i> <span data-i18n="codex-agent.label.directory"></span></label>
        <input type="text" id="node-input-directory" style="width: 70%;">
        <input type="hidden" id="node-input-directoryType">
    </div>
    <div class="form-row">
        <label for="node-input-prompt"><i class="fa fa-comment"></i> <span data-i18n="codex-agent.label.prompt"></span></label>
        <input type="text" id="node-input-prompt" style="width: 70%;">
        <input type="hidden" id="node-input-promptType">
    </div>
    <div class="form-row">
        <label>&nbsp;</label>
        <input type="checkbox" id="node-input-allowEdits" style="display: inline-block; width: auto; vertical-align: top;">
        <label for="node-input-allowEdits" style="width: 70%;" data-i18n="codex-agent.label.allowEdits"></label>
    </div>
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> <span data-i18n="common.label.name"></span></label>
        <input type="text" id="node-input-name">
    </div>
</script>

<script type="text/javascript">
    RED.nodes.registerType("codex agent", {
        category: "function",
        color: "darksalmon",
        defaults: {
            name: {value: ""},
            directory: {value: "git.path", required: true},
            directoryType: {value: "msg"},
            prompt: {value: "payload", required: true},
            promptType: {value: "msg"},
            allowEdits: {value: false}
        },
        inputs: 1,
        outputs: 1,
        icon: "cog.svg",
        label: function() {
            return this.name || this._("codex-agent.name");
        },
        labelStyle: function() {
            return this.name ? "node_label_italic" : "";
        },
        oneditprepare: function() {
            $("#node-input-directory").typedInput({default: "msg", types: ["msg", "str", "env"], typeField: $("#node-input-directoryType")});
            $("#node-input-prompt").typedInput({default: "msg", types: ["msg", "str", "env"], typeField: $("#node-input-promptType")});
        }
    });
</script>

<script type="text/html" data-help-name="codex agent">
    <p>Runs one Codex SDK turn with a working directory and a prompt. By default it reads the directory from <code>msg.git.path</code> and the prompt from <code>msg.payload</code>. You can choose other properties, such as <code>msg.path</code> and <code>msg.prompt</code>, in the editor.</p>
    <p>Returns the final answer in <code>msg.payload</code> and the thread ID and usage in <code>msg.codex</code>. It starts a new thread for each message and processes one message at a time.</p>
    <p>Requires Codex authentication for the Node-RED process. Requests are sent to OpenAI and may incur charges. Repository commands have no network access. The node is read-only unless you explicitly enable edits. It cannot ask for interactive approvals.</p>
    <p>When using the path from <code>msg.git.path</code>, the selected <code>msg.git.ref</code> must already be checked out. The Git Repo node checks out the branch before forwarding the message.</p>
</script>
